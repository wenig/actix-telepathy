[package]
name = "actix-telepathy"
version = "0.7.0"
authors = ["wenig <info@pwenig.de>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/wenig/actix-telepathy/"
readme = "README.md"
description = "Cluster extension for the actix actor framework"
keywords = ["actor", "distributed", "decentralized", "network", "actix"]
categories = ["network-programming"]

[lib]
name = "actix_telepathy"
path = "src/lib.rs"

[workspace]
members = [
  "./",
  "actix-telepathy-derive"
]

[features]
default = ["derive"]
derive = ["actix_telepathy_derive"]

[dev-dependencies]
actix-rt = "2.9.0"
port_scanner = "0.1.5"
rayon = "1.5.0"
futures-sink = "0.3.21"
testing_logger = "0.1.1"

[dependencies]
actix_telepathy_derive = { version = "0.4.0", optional = true }

log = "0.4"
env_logger = "0.11"
byteorder = "1.3"
bytes = "1.11.1"
actix = "=0.13.5"
actix-broker = "0.4.3"
tokio = { version = "1.33", features = ["io-util", "sync"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = { version = "0.1", features = ["net"]}
futures = "0.3"
rand = "0.10.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
once_cell = "1.5.2"
parking_lot = "0.12"

serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
flexbuffers = "25.12.19"

# dns resolver
hickory-proto = { version = "0.25.2" }
hickory-resolver = { version = "0.25.2" }
derive_more = { version = "2.1.1", features = ["full"] }

[patch.crates-io]
actix-telepathy = { path = "." }
actix_telepathy_derive = { path = "actix-telepathy-derive" }
